<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            border: 1px solid;
            line-height: 200px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="box" onmousedown="getKeyDown()" onmouseup="getKeyRelease()"></div>

    <script>
        let ele=document.getElementsByClassName("box")

        function getKeyDown(){
            ele[0].style.borderRadius="100px"
            ele[0].style.backgroundColor="pink"
        }

        function getKeyRelease(){
            
            ele[0].style.borderRadius="50px"
            ele[0].style.backgroundColor="aqua"
        }

    </script>
</body>
</html>
